[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runtime-causality-graph"
version = "0.1.0"
description = "Runtime execution graph that explains how an observed outcome was produced — connects processes, functions, network calls, files, databases, jobs, and exceptions into an explainable causal trace."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Runtime Causality Graph Contributors" }]
keywords = ["observability", "tracing", "root-cause-analysis", "debugging", "causality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.24"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.9",
    "ruff>=0.4",
]

[project.scripts]
causeg = "causality_graph.cli:main"

[project.urls]
Homepage = "https://github.com/example/runtime-causality-graph"

[tool.hatch.build.targets.wheel]
packages = ["src/causality_graph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
